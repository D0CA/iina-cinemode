<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="pause">
      <div id="backdrop"></div>
      <div class="vignette"></div>
      <div class="scrim"></div>
      <div class="layout">
        <div class="poster-wrap">
          <img id="poster" alt="" />
        </div>
        <div class="info">
          <div id="info-hit" data-clickable>
            <img id="logo" alt="" data-clickable />
            <h1 id="title" data-clickable></h1>
            <div id="meta" class="meta" data-clickable></div>
            <p id="synopsis" data-clickable></p>
          </div>
          <button id="upnext" type="button" class="upnext hidden" data-clickable></button>
          <div id="cast" class="cast"></div>
          <div class="actions">
            <button id="resume" type="button" data-clickable>Reprendre</button>
            <button id="search" type="button" data-clickable>Rechercher un titre</button>
          </div>
          <p id="hint" class="hint hidden"></p>
        </div>
      </div>
      <div id="scrubber" class="scrubber">
        <div class="scrubber-track">
          <div id="progress-fill"></div>
        </div>
        <div class="scrubber-times">
          <span id="progress-now"></span>
          <span id="progress-end"></span>
        </div>
      </div>
    </div>
    <button id="skip" type="button" data-clickable>
      Passer l'intro
    </button>
    <script src="overlay.js"></script>
  </body>
</html>
