<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="search.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <button id="back" type="button" class="ghost hidden">Retour</button>
        <h1 id="heading">Rechercher un titre</h1>
        <p id="crumb" class="crumb"></p>
        <p id="file-hint" class="file-hint hidden"></p>
      </header>

      <form id="search-form">
        <input id="query" type="text" autocomplete="off" placeholder="Nom de la série" />
        <button id="submit" type="submit">Rechercher</button>
      </form>

      <p id="status" class="status hidden"></p>
      <div id="list" class="list"></div>
    </div>
    <script src="search.js"></script>
  </body>
</html>
